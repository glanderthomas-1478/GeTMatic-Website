<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="Kamerabasierte Qualitätskontrolle mit Ausschleusung">
  <defs>
    <linearGradient id="qkBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c2a2d"/>
      <stop offset="60%" stop-color="#172224"/>
      <stop offset="100%" stop-color="#0e1516"/>
    </linearGradient>
    <linearGradient id="qkFloor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2b2d"/>
      <stop offset="100%" stop-color="#101718"/>
    </linearGradient>
    <linearGradient id="qkSteel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6f7c80"/>
      <stop offset="100%" stop-color="#434d50"/>
    </linearGradient>
    <linearGradient id="qkSteelDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b4548"/>
      <stop offset="100%" stop-color="#262e30"/>
    </linearGradient>
    <linearGradient id="qkBelt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c3436"/>
      <stop offset="100%" stop-color="#1a2022"/>
    </linearGradient>
    <linearGradient id="qkBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c9a77a"/>
      <stop offset="100%" stop-color="#9c7c52"/>
    </linearGradient>
    <linearGradient id="qkBoxTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dcbd92"/>
      <stop offset="100%" stop-color="#c7a676"/>
    </linearGradient>
    <linearGradient id="qkBad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c9a77a"/>
      <stop offset="100%" stop-color="#9c7c52"/>
    </linearGradient>
    <linearGradient id="qkTeal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5AD7D7"/>
      <stop offset="100%" stop-color="#209D9D"/>
    </linearGradient>
    <linearGradient id="qkCone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5AD7D7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#5AD7D7" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="qkScreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f2a2c"/>
      <stop offset="100%" stop-color="#081a1b"/>
    </linearGradient>
    <radialGradient id="qkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5AD7D7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5AD7D7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="qkBeltLines" width="24" height="20" patternUnits="userSpaceOnUse">
      <rect width="24" height="20" fill="url(#qkBelt)"/>
      <line x1="0" y1="0" x2="0" y2="20" stroke="#3a4446" stroke-width="2"/>
    </pattern>
  </defs>

  <!-- Halle -->
  <rect width="800" height="400" fill="url(#qkBg)"/>
  <g opacity="0.25" stroke="#3a4a4d" stroke-width="1">
    <line x1="0" y1="60" x2="800" y2="60"/>
    <line x1="100" y1="0" x2="100" y2="250"/>
    <line x1="300" y1="0" x2="300" y2="250"/>
    <line x1="500" y1="0" x2="500" y2="250"/>
    <line x1="700" y1="0" x2="700" y2="250"/>
  </g>
  <rect y="300" width="800" height="100" fill="url(#qkFloor)"/>

  <!-- Förderband -->
  <rect x="20" y="248" width="760" height="22" rx="11" fill="url(#qkBeltLines)"/>
  <rect x="20" y="248" width="760" height="4" fill="#4a5659"/>
  <circle cx="31" cy="259" r="9" fill="url(#qkSteel)" stroke="#232b2d" stroke-width="2"/>
  <circle cx="769" cy="259" r="9" fill="url(#qkSteel)" stroke="#232b2d" stroke-width="2"/>
  <rect x="20" y="270" width="760" height="10" fill="url(#qkSteelDark)"/>
  <!-- Beine -->
  <g fill="url(#qkSteelDark)">
    <rect x="60" y="280" width="12" height="70"/>
    <rect x="300" y="280" width="12" height="70"/>
    <rect x="520" y="280" width="12" height="70"/>
    <rect x="728" y="280" width="12" height="70"/>
  </g>
  <rect x="40" y="345" width="720" height="6" fill="#0b1112" opacity="0.6"/>

  <!-- Laufrichtung -->
  <g fill="#209D9D" opacity="0.7">
    <path d="M90 292 l14 6 -14 6z"/>
    <path d="M112 292 l14 6 -14 6z"/>
    <path d="M134 292 l14 6 -14 6z"/>
  </g>

  <!-- Produkte (i.O.) -->
  <g>
    <rect x="60" y="208" width="56" height="40" fill="url(#qkBox)" stroke="#6e5638" stroke-width="1.5"/>
    <path d="M60 208 l10 -10 h56 l-10 10z" fill="url(#qkBoxTop)" stroke="#6e5638" stroke-width="1.5"/>
    <path d="M116 208 l10 -10 v40 l-10 10z" fill="#8a6c45" stroke="#6e5638" stroke-width="1.5"/>
    <rect x="72" y="220" width="30" height="12" fill="#efe6d6" opacity="0.8"/>
  </g>
  <g>
    <rect x="170" y="208" width="56" height="40" fill="url(#qkBox)" stroke="#6e5638" stroke-width="1.5"/>
    <path d="M170 208 l10 -10 h56 l-10 10z" fill="url(#qkBoxTop)" stroke="#6e5638" stroke-width="1.5"/>
    <path d="M226 208 l10 -10 v40 l-10 10z" fill="#8a6c45" stroke="#6e5638" stroke-width="1.5"/>
    <rect x="182" y="220" width="30" height="12" fill="#efe6d6" opacity="0.8"/>
  </g>

  <!-- Prüfportal + Kamera -->
  <rect x="262" y="70" width="12" height="178" fill="url(#qkSteel)"/>
  <rect x="396" y="70" width="12" height="178" fill="url(#qkSteel)"/>
  <rect x="254" y="62" width="162" height="16" rx="3" fill="url(#qkSteel)"/>
  <!-- Beleuchtungsring -->
  <ellipse cx="335" cy="252" rx="80" ry="14" fill="url(#qkGlow)"/>
  <!-- Sichtkegel -->
  <path d="M322 128 L290 246 H380 L348 128 Z" fill="url(#qkCone)"/>
  <!-- Kamera -->
  <rect x="316" y="78" width="38" height="14" fill="url(#qkSteelDark)"/>
  <rect x="306" y="90" width="58" height="30" rx="4" fill="url(#qkSteelDark)" stroke="#5AD7D7" stroke-width="1.5"/>
  <rect x="322" y="118" width="26" height="12" rx="2" fill="#1a2224" stroke="#5a676b" stroke-width="1.5"/>
  <circle cx="335" cy="130" r="6" fill="#0a1416" stroke="#5AD7D7" stroke-width="2"/>
  <circle cx="352" cy="98" r="2.5" fill="#5AD7D7"/>
  <!-- Produkt unter Kamera (i.O.) -->
  <g>
    <rect x="307" y="208" width="56" height="40" fill="url(#qkBox)" stroke="#6e5638" stroke-width="1.5"/>
    <path d="M307 208 l10 -10 h56 l-10 10z" fill="url(#qkBoxTop)" stroke="#6e5638" stroke-width="1.5"/>
    <path d="M363 208 l10 -10 v40 l-10 10z" fill="#8a6c45" stroke="#6e5638" stroke-width="1.5"/>
    <rect x="319" y="220" width="30" height="12" fill="#efe6d6" opacity="0.8"/>
  </g>
  <!-- Scan-Linie -->
  <line x1="298" y1="226" x2="372" y2="226" stroke="#5AD7D7" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- Kabel Kamera -> Auswertung -->
  <path d="M364 100 C 420 100, 430 60, 470 60" fill="none" stroke="#3f4a4d" stroke-width="3"/>

  <!-- Auswertungs-Monitor -->
  <rect x="470" y="30" width="170" height="112" rx="6" fill="url(#qkSteelDark)" stroke="#4d595c" stroke-width="2"/>
  <rect x="480" y="40" width="150" height="92" rx="3" fill="url(#qkScreen)"/>
  <!-- Bildausschnitt -->
  <rect x="488" y="48" width="64" height="48" fill="#1a3336" stroke="#209D9D" stroke-width="1"/>
  <rect x="500" y="60" width="40" height="26" fill="#9c7c52" opacity="0.85"/>
  <rect x="506" y="66" width="22" height="8" fill="#efe6d6" opacity="0.8"/>
  <rect x="496" y="56" width="48" height="34" fill="none" stroke="#5AD7D7" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- Ergebnis-Liste -->
  <g stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M562 54 l4 4 8 -8" stroke="#5AD7D7"/>
    <path d="M562 72 l4 4 8 -8" stroke="#5AD7D7"/>
    <path d="M563 87 l9 9 M572 87 l-9 9" stroke="#e5484d"/>
  </g>
  <g fill="#3c5a5d">
    <rect x="580" y="51" width="40" height="5" rx="2"/>
    <rect x="580" y="69" width="34" height="5" rx="2"/>
    <rect x="580" y="88" width="38" height="5" rx="2"/>
  </g>
  <!-- Balken -->
  <rect x="488" y="106" width="134" height="6" rx="3" fill="#1f3a3c"/>
  <rect x="488" y="106" width="96" height="6" rx="3" fill="url(#qkTeal)"/>
  <rect x="488" y="118" width="134" height="6" rx="3" fill="#1f3a3c"/>
  <rect x="488" y="118" width="18" height="6" rx="3" fill="#e5484d"/>
  <rect x="549" y="142" width="12" height="14" fill="url(#qkSteel)"/>
  <rect x="530" y="154" width="50" height="6" rx="2" fill="url(#qkSteel)"/>

  <!-- Signal zur Ausschleusung -->
  <path d="M555 160 V 176" stroke="#e5484d" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- Fehlerhaftes Produkt -->
  <g>
    <rect x="470" y="208" width="56" height="40" fill="url(#qkBad)" stroke="#e5484d" stroke-width="2.5"/>
    <path d="M470 208 l10 -10 h56 l-10 10z" fill="url(#qkBoxTop)" stroke="#e5484d" stroke-width="2.5"/>
    <path d="M526 208 l10 -10 v40 l-10 10z" fill="#8a6c45" stroke="#e5484d" stroke-width="2.5"/>
    <!-- Beschädigung -->
    <path d="M488 208 l6 12 -8 8 10 10" fill="none" stroke="#3b2a18" stroke-width="2"/>
    <circle cx="512" cy="228" r="8" fill="#e5484d"/>
    <path d="M508 224 l8 8 M516 224 l-8 8" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Ausschleuser (Pneumatikzylinder) -->
  <rect x="540" y="176" width="30" height="16" rx="3" fill="url(#qkSteel)" stroke="#2a3234" stroke-width="1.5"/>
  <rect x="570" y="180" width="46" height="8" fill="url(#qkSteelDark)"/>
  <rect x="608" y="170" width="10" height="72" rx="2" fill="url(#qkTeal)"/>
  <circle cx="547" cy="184" r="2.5" fill="#e5484d"/>

  <!-- Ausschleus-Pfeil + Behälter -->
  <path d="M600 262 C 620 300, 640 310, 660 318" fill="none" stroke="#e5484d" stroke-width="2.5" stroke-dasharray="6 4"/>
  <path d="M654 312 l12 8 -14 3z" fill="#e5484d"/>
  <g>
    <path d="M630 322 h120 l-10 56 h-100z" fill="url(#qkSteelDark)" stroke="#e5484d" stroke-width="2"/>
    <rect x="626" y="316" width="128" height="8" rx="2" fill="url(#qkSteel)"/>
    <path d="M662 346 l10 10 M672 346 l-10 10" stroke="#e5484d" stroke-width="3" stroke-linecap="round"/>
    <rect x="684" y="340" width="36" height="22" fill="#9c7c52" opacity="0.6" transform="rotate(-12 702 351)"/>
  </g>

  <!-- Weiterlaufende i.O.-Ware -->
  <g>
    <rect x="690" y="208" width="56" height="40" fill="url(#qkBox)" stroke="#6e5638" stroke-width="1.5"/>
    <path d="M690 208 l10 -10 h56 l-10 10z" fill="url(#qkBoxTop)" stroke="#6e5638" stroke-width="1.5"/>
    <path d="M746 208 l10 -10 v40 l-10 10z" fill="#8a6c45" stroke="#6e5638" stroke-width="1.5"/>
    <rect x="702" y="220" width="30" height="12" fill="#efe6d6" opacity="0.8"/>
    <circle cx="742" cy="190" r="10" fill="#209D9D"/>
    <path d="M737 190 l4 4 7 -7" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Schaltschrank / SPS -->
  <rect x="40" y="90" width="120" height="96" rx="4" fill="url(#qkSteelDark)" stroke="#4d595c" stroke-width="2"/>
  <rect x="52" y="102" width="96" height="26" rx="2" fill="#162022"/>
  <g fill="#209D9D">
    <rect x="58" y="108" width="12" height="14"/>
    <rect x="74" y="108" width="12" height="14"/>
    <rect x="90" y="108" width="12" height="14"/>
    <rect x="106" y="108" width="12" height="14"/>
    <rect x="122" y="108" width="20" height="14" fill="#5AD7D7"/>
  </g>
  <g fill="#5AD7D7">
    <circle cx="62" cy="144" r="3"/>
    <circle cx="74" cy="144" r="3" fill="#e5484d"/>
    <circle cx="86" cy="144" r="3"/>
  </g>
  <rect x="52" y="156" width="96" height="4" rx="2" fill="#2a3436"/>
  <rect x="52" y="166" width="70" height="4" rx="2" fill="#2a3436"/>
  <!-- Datenleitung SPS -> Portal -->
  <path d="M160 120 C 210 120, 220 70, 254 70" fill="none" stroke="#209D9D" stroke-width="2" stroke-dasharray="5 4" opacity="0.8"/>
</svg>

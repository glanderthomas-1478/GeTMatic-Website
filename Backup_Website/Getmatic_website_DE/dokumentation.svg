<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="Technische Dokumentation Schaltplan Handbuch">
  <defs>
    <linearGradient id="docBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8"/>
      <stop offset="60%" style="stop-color:#e8eef4"/>
      <stop offset="100%" style="stop-color:#dce5ee"/>
    </linearGradient>
    <linearGradient id="deskG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d7a96e"/>
      <stop offset="100%" style="stop-color:#b8865a"/>
    </linearGradient>
    <linearGradient id="screenG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1e2a"/>
      <stop offset="100%" style="stop-color:#1a2e3e"/>
    </linearGradient>
    <linearGradient id="monitorG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#37474f"/>
      <stop offset="100%" style="stop-color:#263238"/>
    </linearGradient>
    <linearGradient id="paperG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#f0f4f8"/>
    </linearGradient>
    <linearGradient id="binderBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1565c0"/>
      <stop offset="100%" style="stop-color:#1976d2"/>
    </linearGradient>
    <linearGradient id="binderGray" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#546e7a"/>
      <stop offset="100%" style="stop-color:#607d8b"/>
    </linearGradient>
    <linearGradient id="tealAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#26a69a"/>
      <stop offset="100%" style="stop-color:#00796b"/>
    </linearGradient>
    <linearGradient id="floorG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#cfd8e0"/>
      <stop offset="100%" style="stop-color:#b8c4ce"/>
    </linearGradient>
    <linearGradient id="ceilingG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#dce6ef"/>
      <stop offset="100%" style="stop-color:#c8d6e2"/>
    </linearGradient>
    <filter id="softShadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#00000025"/>
    </filter>
    <filter id="pageShadow">
      <feDropShadow dx="3" dy="3" stdDeviation="4" flood-color="#00000030"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>text { font-family: Arial, Helvetica, sans-serif; }</style>
  </defs>

  <!-- Hintergrund -->
  <rect width="800" height="400" fill="url(#docBg)"/>

  <!-- Decke -->
  <rect x="0" y="0" width="800" height="62" fill="url(#ceilingG)"/>
  <rect x="0"   y="0" width="10" height="62" fill="#b0bec5"/>
  <rect x="198" y="0" width="10" height="62" fill="#b0bec5"/>
  <rect x="396" y="0" width="10" height="62" fill="#b0bec5"/>
  <rect x="594" y="0" width="10" height="62" fill="#b0bec5"/>
  <rect x="790" y="0" width="10" height="62" fill="#b0bec5"/>
  <rect x="0" y="30" width="800" height="5" fill="#b0bec5" opacity="0.5"/>
  <!-- Lampen -->
  <rect x="76"  y="6" width="62" height="16" rx="4" fill="#ffffff" stroke="#cfd8dc" stroke-width="1" filter="url(#softShadow)"/>
  <rect x="472" y="6" width="62" height="16" rx="4" fill="#ffffff" stroke="#cfd8dc" stroke-width="1" filter="url(#softShadow)"/>
  <rect x="76"  y="22" width="62" height="4" rx="2" fill="#fffde7" opacity="0.95"/>
  <rect x="472" y="22" width="62" height="4" rx="2" fill="#fffde7" opacity="0.95"/>

  <!-- Boden -->
  <rect x="0" y="330" width="800" height="70" fill="url(#floorG)"/>
  <line x1="0" y1="330" x2="800" y2="330" stroke="#90a4ae" stroke-width="2"/>
  <line x1="0" y1="338" x2="800" y2="338" stroke="#ffd54f" stroke-width="2" stroke-dasharray="30,20" opacity="0.6"/>

  <!-- ===== SCHREIBTISCH ===== -->
  <rect x="80" y="260" width="640" height="18" rx="4" fill="url(#deskG)" stroke="#9e6940" stroke-width="1.5" filter="url(#softShadow)"/>
  <!-- Tischbeine -->
  <rect x="100" y="278" width="16" height="52" rx="3" fill="#b8865a"/>
  <rect x="684" y="278" width="16" height="52" rx="3" fill="#b8865a"/>
  <!-- Tischkante -->
  <rect x="80" y="273" width="640" height="5" rx="2" fill="#9e6940" opacity="0.5"/>

  <!-- ===== MONITOR ===== -->
  <rect x="310" y="110" width="220" height="148" rx="6" fill="url(#monitorG)" stroke="#37474f" stroke-width="2" filter="url(#softShadow)"/>
  <!-- Bildschirm -->
  <rect x="318" y="118" width="204" height="132" rx="3" fill="url(#screenG)" stroke="#209d9d" stroke-width="1.5"/>
  <!-- Monitorständer -->
  <rect x="408" y="258" width="24" height="10" rx="2" fill="#37474f"/>
  <rect x="392" y="268" width="56" height="6" rx="3" fill="#263238"/>

  <!-- Code-Zeilen auf dem Bildschirm -->
  <text x="328" y="134" font-size="8" fill="#5ad7d7" font-family="monospace">// Funktionsbaustein FB10</text>
  <rect x="328" y="138" width="90" height="5" rx="1" fill="#00e676" opacity="0.7"/>
  <rect x="328" y="147" width="120" height="5" rx="1" fill="#90caf9" opacity="0.7"/>
  <rect x="336" y="156" width="80" height="5" rx="1" fill="#ffe082" opacity="0.7"/>
  <rect x="336" y="165" width="100" height="5" rx="1" fill="#90caf9" opacity="0.7"/>
  <rect x="336" y="174" width="60" height="5" rx="1" fill="#ef9a9a" opacity="0.7"/>
  <rect x="328" y="183" width="110" height="5" rx="1" fill="#90caf9" opacity="0.7"/>
  <rect x="336" y="192" width="85" height="5" rx="1" fill="#ffe082" opacity="0.7"/>
  <rect x="336" y="201" width="75" height="5" rx="1" fill="#90caf9" opacity="0.7"/>
  <rect x="328" y="210" width="50" height="5" rx="1" fill="#00e676" opacity="0.7"/>
  <!-- Cursor blinkt -->
  <rect x="328" y="220" width="6" height="9" rx="1" fill="#5ad7d7" opacity="0.9" filter="url(#glow)"/>
  <!-- Zeilennummern -->
  <text x="322" y="143" font-size="7" fill="#546e7a" font-family="monospace">1</text>
  <text x="322" y="152" font-size="7" fill="#546e7a" font-family="monospace">2</text>
  <text x="322" y="161" font-size="7" fill="#546e7a" font-family="monospace">3</text>
  <text x="322" y="170" font-size="7" fill="#546e7a" font-family="monospace">4</text>
  <text x="322" y="179" font-size="7" fill="#546e7a" font-family="monospace">5</text>
  <text x="322" y="188" font-size="7" fill="#546e7a" font-family="monospace">6</text>
  <text x="322" y="197" font-size="7" fill="#546e7a" font-family="monospace">7</text>
  <text x="322" y="206" font-size="7" fill="#546e7a" font-family="monospace">8</text>
  <text x="322" y="215" font-size="7" fill="#546e7a" font-family="monospace">9</text>
  <!-- Status-Leiste unten im Bildschirm -->
  <rect x="318" y="238" width="204" height="12" rx="0" fill="#00796b" opacity="0.85"/>
  <text x="326" y="247" font-size="7" fill="#e0f2f1" font-family="monospace">TIA Portal v19  ●  FB10  ●  Zeile 9</text>

  <!-- ===== SCHALTPLAN (grosses Papier links) ===== -->
  <rect x="88" y="128" width="200" height="130" rx="3" fill="url(#paperG)" stroke="#cfd8e0" stroke-width="1.5" filter="url(#pageShadow)"/>
  <!-- Rand-Markierungen Schaltplan -->
  <rect x="96" y="136" width="184" height="114" fill="none" stroke="#90a4ae" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <!-- Schaltplan-Inhalt: Blöcke und Verbindungen -->
  <rect x="104" y="148" width="36" height="24" rx="2" fill="none" stroke="#1565c0" stroke-width="1.5"/>
  <text x="122" y="164" font-size="8" fill="#1565c0" text-anchor="middle" font-weight="bold">SPS</text>
  <rect x="164" y="144" width="40" height="32" rx="2" fill="none" stroke="#00796b" stroke-width="1.5"/>
  <text x="184" y="158" font-size="7" fill="#00796b" text-anchor="middle">FU</text>
  <text x="184" y="168" font-size="7" fill="#00796b" text-anchor="middle">Drive</text>
  <rect x="230" y="148" width="36" height="24" rx="2" fill="none" stroke="#e65100" stroke-width="1.5"/>
  <text x="248" y="164" font-size="8" fill="#e65100" text-anchor="middle">Motor</text>
  <!-- Verbindungslinien -->
  <line x1="140" y1="160" x2="164" y2="160" stroke="#546e7a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="204" y1="160" x2="230" y2="160" stroke="#546e7a" stroke-width="1.5"/>
  <!-- Weitere Linien / Netz -->
  <line x1="104" y1="196" x2="268" y2="196" stroke="#90a4ae" stroke-width="1" opacity="0.6"/>
  <line x1="104" y1="208" x2="268" y2="208" stroke="#90a4ae" stroke-width="1" opacity="0.6"/>
  <line x1="104" y1="220" x2="200" y2="220" stroke="#90a4ae" stroke-width="1" opacity="0.6"/>
  <!-- Tabelle unten -->
  <rect x="104" y="192" width="164" height="40" rx="1" fill="none" stroke="#b0bec5" stroke-width="1"/>
  <line x1="104" y1="204" x2="268" y2="204" stroke="#b0bec5" stroke-width="1"/>
  <line x1="104" y1="216" x2="268" y2="216" stroke="#b0bec5" stroke-width="1"/>
  <line x1="160" y1="192" x2="160" y2="232" stroke="#b0bec5" stroke-width="1"/>
  <line x1="214" y1="192" x2="214" y2="232" stroke="#b0bec5" stroke-width="1"/>
  <text x="130" y="201" font-size="6" fill="#607d8b" text-anchor="middle">Bezeichnung</text>
  <text x="186" y="201" font-size="6" fill="#607d8b" text-anchor="middle">Typ</text>
  <text x="242" y="201" font-size="6" fill="#607d8b" text-anchor="middle">Adresse</text>
  <text x="130" y="212" font-size="6" fill="#455a64" text-anchor="middle">Motorschutz</text>
  <text x="186" y="212" font-size="6" fill="#455a64" text-anchor="middle">E 0.0</text>
  <text x="242" y="212" font-size="6" fill="#455a64" text-anchor="middle">IW100</text>
  <text x="130" y="224" font-size="6" fill="#455a64" text-anchor="middle">Freigabe</text>
  <text x="186" y="224" font-size="6" fill="#455a64" text-anchor="middle">A 4.1</text>
  <text x="242" y="224" font-size="6" fill="#455a64" text-anchor="middle">QW112</text>
  <!-- Titel Schaltplan -->
  <rect x="88" y="128" width="200" height="14" rx="3" fill="#1565c0" opacity="0.9"/>
  <text x="188" y="139" font-size="8" fill="white" text-anchor="middle" font-weight="bold">Schaltplan – Antriebssteuerung</text>
  <!-- Stempel unten rechts -->
  <rect x="222" y="234" width="62" height="20" rx="2" fill="none" stroke="#e53935" stroke-width="1.5"/>
  <text x="253" y="243" font-size="7" fill="#e53935" text-anchor="middle" font-weight="bold">FREIGEGEBEN</text>
  <text x="253" y="251" font-size="6" fill="#e53935" text-anchor="middle">Rev. 3 · 2026</text>

  <!-- ===== ORDNER / BINDER (rechts) ===== -->
  <!-- Binder 1 (blau, breit) -->
  <rect x="560" y="130" width="38" height="130" rx="4" fill="url(#binderBlue)" stroke="#0d47a1" stroke-width="1.5" filter="url(#softShadow)"/>
  <rect x="562" y="132" width="6" height="126" rx="3" fill="#0d47a1" opacity="0.5"/>
  <rect x="564" y="170" width="30" height="52" rx="2" fill="#0d47a1" opacity="0.3"/>
  <text x="579" y="184" font-size="7" fill="white" text-anchor="middle" font-weight="bold" transform="rotate(90,579,196)">Betriebshandbuch</text>
  <rect x="564" y="240" width="30" height="14" rx="1" fill="white" opacity="0.9"/>
  <text x="579" y="250" font-size="7" fill="#1565c0" text-anchor="middle" font-weight="bold">REV 3</text>

  <!-- Binder 2 (grau) -->
  <rect x="604" y="148" width="34" height="112" rx="4" fill="url(#binderGray)" stroke="#455a64" stroke-width="1.5" filter="url(#softShadow)"/>
  <rect x="606" y="150" width="5" height="108" rx="2" fill="#37474f" opacity="0.5"/>
  <text x="621" y="162" font-size="7" fill="white" text-anchor="middle" font-weight="bold" transform="rotate(90,621,204)">Schaltpläne</text>
  <rect x="607" y="232" width="28" height="14" rx="1" fill="white" opacity="0.9"/>
  <text x="621" y="242" font-size="6" fill="#37474f" text-anchor="middle">E-Plan</text>

  <!-- Binder 3 (teal, schmal) -->
  <rect x="644" y="158" width="28" height="102" rx="4" fill="#00796b" stroke="#004d40" stroke-width="1.5" filter="url(#softShadow)"/>
  <rect x="646" y="160" width="5" height="98" rx="2" fill="#004d40" opacity="0.4"/>
  <text x="658" y="172" font-size="7" fill="white" text-anchor="middle" font-weight="bold" transform="rotate(90,658,209)">Wartungsplan</text>

  <!-- ===== KLEINES NOTIZHEFT auf Tisch ===== -->
  <rect x="490" y="218" width="60" height="42" rx="2" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5" filter="url(#softShadow)" transform="rotate(-5,520,239)"/>
  <line x1="494" y1="228" x2="546" y2="226" stroke="#f9a825" stroke-width="0.8" opacity="0.6" transform="rotate(-5,520,239)"/>
  <line x1="494" y1="236" x2="546" y2="234" stroke="#f9a825" stroke-width="0.8" opacity="0.6" transform="rotate(-5,520,239)"/>
  <line x1="494" y1="244" x2="546" y2="242" stroke="#f9a825" stroke-width="0.8" opacity="0.6" transform="rotate(-5,520,239)"/>
  <line x1="494" y1="252" x2="530" y2="250" stroke="#f9a825" stroke-width="0.8" opacity="0.6" transform="rotate(-5,520,239)"/>
  <!-- Stift -->
  <rect x="554" y="216" width="6" height="50" rx="3" fill="#e53935" stroke="#c62828" stroke-width="1" transform="rotate(10,557,241)"/>
  <polygon points="554,266 560,266 557,274" fill="#ffd54f" transform="rotate(10,557,241)"/>

  <!-- ===== DRUCKER (ganz links) ===== -->
  <rect x="88" y="200" width="80" height="56" rx="5" fill="#37474f" stroke="#263238" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="92" y="206" width="72" height="8" rx="2" fill="#263238"/>
  <!-- Papierausgabe -->
  <rect x="96" y="214" width="64" height="4" rx="1" fill="#546e7a"/>
  <!-- Ausgabe-Papier -->
  <rect x="100" y="196" width="56" height="22" rx="1" fill="white" stroke="#90a4ae" stroke-width="1" filter="url(#softShadow)"/>
  <line x1="106" y1="202" x2="150" y2="202" stroke="#b0bec5" stroke-width="1"/>
  <line x1="106" y1="207" x2="150" y2="207" stroke="#b0bec5" stroke-width="1"/>
  <line x1="106" y1="212" x2="136" y2="212" stroke="#b0bec5" stroke-width="1"/>
  <!-- Display Drucker -->
  <rect x="96" y="226" width="48" height="18" rx="2" fill="#0f1e2a" stroke="#209d9d" stroke-width="1"/>
  <text x="120" y="238" font-size="7" fill="#00e676" text-anchor="middle" font-family="monospace">DRUCKEN</text>
  <!-- LED grün -->
  <circle cx="154" cy="228" r="4" fill="#00c853" filter="url(#glow)"/>
  <!-- Papierfach -->
  <rect x="92" y="244" width="72" height="8" rx="2" fill="#263238"/>
  <rect x="96" y="248" width="64" height="2" rx="1" fill="#546e7a" opacity="0.5"/>

  <!-- ===== INFO-OVERLAYS ===== -->
  <!-- Links unten -->
  <rect x="88" y="345" width="210" height="44" rx="6" fill="white" opacity="0.92" stroke="#209d9d" stroke-width="1.5" filter="url(#softShadow)"/>
  <text x="98" y="361" font-size="10" font-weight="bold" fill="#00796b">Revisionssichere Dokumentation</text>
  <text x="98" y="376" font-size="9" fill="#607d8b">Schaltpläne · Handbücher · Protokolle</text>
  <circle cx="288" cy="358" r="6" fill="#00c853" filter="url(#glow)"/>

  <!-- Mitte unten -->
  <rect x="300" y="345" width="200" height="44" rx="6" fill="white" opacity="0.92" stroke="#00796b" stroke-width="1.5" filter="url(#softShadow)"/>
  <text x="400" y="361" font-size="10" font-weight="bold" fill="#00796b" text-anchor="middle">Normenkonform</text>
  <text x="400" y="378" font-size="13" font-weight="bold" fill="#1a3a5c" text-anchor="middle">EN · ISO · DIN · VDE</text>

  <!-- Rechts unten -->
  <rect x="502" y="345" width="210" height="44" rx="6" fill="white" opacity="0.92" stroke="#1565c0" stroke-width="1.5" filter="url(#softShadow)"/>
  <text x="512" y="361" font-size="10" font-weight="bold" fill="#1565c0">TIA Portal · E-Plan · PDF</text>
  <text x="512" y="376" font-size="9" fill="#607d8b">Vollständige Projektunterlagen</text>
  <circle cx="702" cy="358" r="6" fill="#42a5f5" filter="url(#glow)"/>

  <!-- Oben rechts Bezeichnung -->
  <rect x="504" y="40" width="282" height="26" rx="6" fill="white" opacity="0.8" stroke="#cfd8dc" stroke-width="1" filter="url(#softShadow)"/>
  <text x="645" y="54" font-size="10" fill="#546e7a" text-anchor="middle">Technische Dokumentation</text>
  <text x="645" y="62" font-size="9" fill="#90a4ae" text-anchor="middle">GeTMatic Automatisierungstechnik</text>
</svg>
